<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<style>
:root {
  --bg: #faf8f6;
  --surface: #ffffff;
  --surface2: #f3eee9;
  --border: #e8e1da;
  --text: #3a3530;
  --text-secondary: #8a8079;
  --text-tertiary: #b3aaa2;
  --accent: #7a9e76;
  --accent-bg: #eef3ec;
  --accent-text: #4d7449;
  --success: #7ab575;
  --success-bg: #eef5ec;
  --danger: #d98f89;
  --danger-bg: #fbeeec;
  --gold: #c9a84c;
  --gold-bg: #fdf6e3;
  --rehab: #8fa8c4;
  --rehab-bg: #edf2f7;
  --rehab-text: #4a6fa5;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1a18;
    --surface: #262320;
    --surface2: #302c28;
    --border: #3a3530;
    --text: #ede8e2;
    --text-secondary: #b3aaa2;
    --text-tertiary: #8a8079;
    --accent: #7a9e76;
    --accent-bg: #243024;
    --accent-text: #a8c3a3;
    --success: #7ab575;
    --success-bg: #1e3020;
    --danger: #c47a74;
    --danger-bg: #332523;
    --gold: #c9a84c;
    --gold-bg: #2e2810;
    --rehab: #6a8aaa;
    --rehab-bg: #1e2a38;
    --rehab-text: #8aafd4;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
body {
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px);
  max-width: 480px;
  margin: 0 auto;
}

/* header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header-date {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 3px;
}

/* summary card */
.summary-card {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 8px;
  text-align: center;
}
.stat-box .num {
  font-size: 20px;
  font-weight: 700;
  display: block;
  color: var(--accent-text);
}
.stat-box .lbl {
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* cycle card */
.cycle-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  margin-bottom: 16px;
}
.cycle-header {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
  margin-bottom: 10px;
}
.cycle-slots {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.cycle-slot {
  flex: 1;
  border-radius: var(--radius-sm);
  padding: 7px 4px;
  text-align: center;
  font-size: 10px;
  font-weight: 500;
}
.cycle-slot.done {
  background: var(--success-bg);
  color: var(--success);
}
.cycle-slot.active {
  background: var(--accent-bg);
  color: var(--accent-text);
  border: 1px solid var(--accent-text);
}
.cycle-slot.empty {
  background: var(--surface2);
  color: var(--text-tertiary);
}
.next-up {
  font-size: 12px;
  color: var(--text-secondary);
}
.next-up strong {
  color: var(--accent-text);
  font-weight: 600;
}

/* tabs */
.tabs-wrap {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  background: var(--surface);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tab:active { transform: scale(0.97); }
.tab.active {
  background: var(--accent-bg);
  color: var(--accent-text);
  border-color: var(--accent-text);
  font-weight: 600;
}
.tab.rehab-tab.active {
  background: var(--rehab-bg);
  color: var(--rehab-text);
  border-color: var(--rehab-text);
}

/* date row */
.date-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.date-row label {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
}
input[type="date"] {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 7px 10px;
  font-size: 14px;
  color-scheme: light dark;
}

/* cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.card.pb-flash {
  border-color: var(--gold);
  background: var(--gold-bg);
}
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
  gap: 8px;
}
.ex-name {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
}
.ex-meta { text-align: right; flex-shrink: 0; }
.ex-last {
  display: block;
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 3px;
}
.ex-pb {
  display: block;
  font-size: 11px;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 3px;
}
.trend {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
}
.trend.up { color: var(--success); background: var(--success-bg); }
.trend.down { color: var(--danger); background: var(--danger-bg); }
.trend.flat { color: var(--text-tertiary); background: var(--surface2); }
.trend.new { color: var(--gold); background: var(--gold-bg); }

/* superset */
.superset-label {
  font-size: 10px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.superset-divider {
  height: 1px;
  background: var(--border);
  margin: 10px 0;
}
.sub-ex-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

/* fields */
.fields {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}
.field {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
}
.field input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 8px 10px;
  font-size: 15px;
  width: 100%;
  -webkit-appearance: none;
}
.field input:focus {
  outline: none;
  border-color: var(--accent);
}
.unit {
  font-size: 11px;
  color: var(--text-tertiary);
  white-space: nowrap;
}

/* rehab fields (time/reps only, no weight) */
.rehab-fields {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
}

/* sparkline */
.sparkline {
  width: 100%;
  height: 30px;
  display: block;
  margin-top: 4px;
}

/* rehab card */
.rehab-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.rehab-card-name {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 3px;
}
.rehab-prescription {
  font-size: 11px;
  color: var(--rehab-text);
  background: var(--rehab-bg);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  margin-bottom: 8px;
  display: inline-block;
}
.rehab-done-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.rehab-done-btn {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.rehab-done-btn.checked {
  background: var(--success-bg);
  color: var(--success);
  border-color: var(--success);
  font-weight: 600;
}
.rehab-sets-done {
  font-size: 12px;
  color: var(--text-tertiary);
  white-space: nowrap;
}

/* buttons */
.btn-row {
  display: flex;
  gap: 10px;
  margin: 16px 0;
}
.btn {
  flex: 1;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 13px 0;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:active { transform: scale(0.97); }
.btn.primary {
  background: var(--accent-bg);
  color: var(--accent-text);
  border-color: var(--accent-text);
  font-weight: 600;
}
.btn.primary.saved {
  background: var(--success-bg);
  color: var(--success);
  border-color: var(--success);
}
.btn.rehab-btn {
  background: var(--rehab-bg);
  color: var(--rehab-text);
  border-color: var(--rehab-text);
}

/* report */
.report-box {
  background: var(--surface2);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 20px;
}
.report-box pre {
  white-space: pre-wrap;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  margin: 0 0 12px;
  color: var(--text);
  line-height: 1.6;
}
.report-empty {
  font-size: 14px;
  color: var(--text-secondary);
}
.copy-note {
  font-size: 12px;
  color: var(--success);
  text-align: center;
  margin-top: 8px;
  min-height: 16px;
}

/* phase badge */
.phase-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--rehab-bg);
  color: var(--rehab-text);
  margin-bottom: 12px;
}

.footer-note {
  font-size: 11px;
  color: var(--text-tertiary);
  text-align: center;
  margin-top: 24px;
  line-height: 1.6;
}
</style>
</head>
<body>

<div id="root"></div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────

const LIFTING_TABS = ["Upper A", "Upper B", "Legs"];

const EXERCISES = {
  "Upper A": [
    { id: "incline_bench", name: "Incline Bench Press", type: "lift" },
    { id: "flat_bench",    name: "Flat Bench Press",    type: "lift" },
    { id: "cable_fly",     name: "Cable Chest Fly",     type: "lift" },
    { id: "lat_raise",     name: "Cable Lateral Raise", type: "lift" },
    { id: "bicep_curl",    name: "Bicep Curl",          type: "lift" }
  ],
  "Upper B": [
    {
      id: "pullup_lat",
      type: "superset",
      parts: [
        { id: "pullup",      name: "Pull-up / Assisted Pull-up", weightOptional: true },
        { id: "lat_pull",    name: "Lat Pulldown" }
      ]
    },
    { id: "db_row",         name: "Single Hand Dumbbell Row",    type: "lift" },
    { id: "straight_arm",   name: "Straight Arm Pulldown",       type: "lift" },
    { id: "face_pull",      name: "Face Pull",                   type: "lift" },
    { id: "hammer_curl",    name: "Hammer Curl",                 type: "lift" },
    { id: "tricep_push",    name: "Tricep Pushdown",             type: "lift" }
  ],
  "Legs": [
    { id: "leg_press",      name: "Leg Press (heel wedge)",      type: "lift" },
    { id: "rdl",            name: "Romanian Deadlift",           type: "lift" },
    { id: "bss",            name: "Bulgarian Split Squat",       type: "lift" },
    { id: "sl_rdl",         name: "Single-Leg RDL",             type: "lift" },
    { id: "calf_raise",     name: "Calf Raise",                  type: "lift" }
  ]
};

const REHAB_PHASE1 = [
  { id: "r1_lunge",    name: "Kneeling Lunge Stretch",  prescription: "30s × 3-4 sets · daily" },
  { id: "r1_jeff",     name: "Jefferson Curl",           prescription: "6-8 reps × 2 sets · 2-3×/week" },
  { id: "r1_swiss",    name: "Swiss Ball Plank",         prescription: "10-20s × 3 sets · 2-3×/week" },
  { id: "r1_cable",    name: "Cable Rotation",           prescription: "1 min × 3 sets · 2-3×/week" },
  { id: "r1_bird",     name: "Birddog",                  prescription: "30s × 3 sets · 2-3×/week" }
];

const REHAB_PHASE2 = [
  { id: "r2_slrdl",    name: "Single-Leg RDL",                        prescription: "10-15 reps × 3 sets · 2-3×/week" },
  { id: "r2_tgu",      name: "Half Turkish Get Up",                   prescription: "8-12 reps × 3 sets · 2-3×/week" },
  { id: "r2_kb",       name: "Kettlebell Kneeling Rotation Swing",    prescription: "8-12 reps × 3 sets · 2-3×/week" },
  { id: "r2_clam",     name: "Side Plank Clamshell",                  prescription: "30s-1min × 3 sets · 2-3×/week" },
  { id: "r2_band",     name: "Banded Joint Mobilization (Ankle)",     prescription: "5s hold × 10 reps × 3 sets · daily" },
  { id: "r2_calf",     name: "Calf Stretch",                          prescription: "30s × 4 reps · daily" }
];

const ROTATION = ["Upper A", "Upper B", "Upper A", "Legs", "Upper B", "Upper A", "Upper B", "Legs"];

const KEY_LOGS   = "wt_logs_v2";
const KEY_PB     = "wt_pb_v2";
const KEY_REHAB  = "wt_rehab_v2";
const KEY_PHASE  = "wt_phase_v2";

// ─── STATE ───────────────────────────────────────────────────────────────────

function load(key, fallback) {
  try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }
  catch(e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

let logs       = load(KEY_LOGS, []);   // [{date, tab, sets: {exId: {weight,reps} or {parts:{partId:{weight,reps}}}}}]
let pbs        = load(KEY_PB, {});     // {exId: {weight, reps, date, volume}}
let rehabLogs  = load(KEY_REHAB, []); // [{date, checks: {rehabId: bool}}]
let phase      = load(KEY_PHASE, 1);  // 1 or 2

let currentTab = "Upper A";
let rehabChecks = {};

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function todayISO() { return new Date().toISOString().slice(0,10); }

function fmt(date) {
  const d = new Date(date + "T00:00:00");
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short"});
}

function volume(w, r) { return (w || 0) * (r || 0); }

function lastLogFor(exId) {
  for (let i = logs.length - 1; i >= 0; i--) {
    const s = logs[i].sets[exId];
    if (s) return { ...s, date: logs[i].date };
  }
  return null;
}

function allVolumesFor(exId) {
  return logs
    .filter(l => l.sets[exId])
    .map(l => ({ date: l.date, vol: volume(l.sets[exId].weight, l.sets[exId].reps) }))
    .filter(x => x.vol > 0);
}

function allVolumesForPart(partId) {
  const out = [];
  logs.forEach(l => {
    Object.values(l.sets).forEach(s => {
      if (s && s.parts && s.parts[partId]) {
        const p = s.parts[partId];
        const v = volume(p.weight, p.reps);
        if (v > 0) out.push({ date: l.date, vol: v });
      }
    });
  });
  return out;
}

function lastLogForPart(partId) {
  for (let i = logs.length - 1; i >= 0; i--) {
    const sets = logs[i].sets;
    for (const s of Object.values(sets)) {
      if (s && s.parts && s.parts[partId]) return { ...s.parts[partId], date: logs[i].date };
    }
  }
  return null;
}

function getNextUp() {
  const n = logs.length % ROTATION.length;
  return ROTATION[n];
}

function checkPB(exId, w, r) {
  const v = volume(w, r);
  if (v <= 0) return false;
  if (!pbs[exId] || v > pbs[exId].volume) {
    pbs[exId] = { weight: w, reps: r, volume: v, date: todayISO() };
    save(KEY_PB, pbs);
    return true;
  }
  return false;
}

function checkPBPart(partId, w, r) {
  const v = volume(w, r);
  if (v <= 0) return false;
  const key = "part_" + partId;
  if (!pbs[key] || v > pbs[key].volume) {
    pbs[key] = { weight: w, reps: r, volume: v, date: todayISO() };
    save(KEY_PB, pbs);
    return true;
  }
  return false;
}

// ─── SPARKLINE ───────────────────────────────────────────────────────────────

function sparkline(volumes) {
  if (volumes.length < 2) return "";
  const vals = volumes.map(v => v.vol);
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = max - min || 1;
  const W = 120, H = 28, pad = 3;
  const step = (W - pad * 2) / (vals.length - 1);
  const pts = vals.map((v, i) => {
    const x = pad + i * step;
    const y = H - pad - ((v - min) / range) * (H - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const col = vals[vals.length-1] >= vals[0] ? "var(--success)" : "var(--danger)";
  return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// ─── TREND BADGE ─────────────────────────────────────────────────────────────

function trendBadge(exId, isPart) {
  const allV = isPart ? allVolumesForPart(exId) : allVolumesFor(exId);
  if (allV.length === 0) return "";
  if (allV.length === 1) return `<span class="trend new">✦ first entry</span>`;
  const last = allV[allV.length-1].vol;
  const prev = allV[allV.length-2].vol;
  if (last > prev) return `<span class="trend up">▲ up</span>`;
  if (last < prev) return `<span class="trend down">▼ down</span>`;
  return `<span class="trend flat">— flat</span>`;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function render() {
  document.getElementById("root").innerHTML = buildPage();
  bindEvents();
}

function buildPage() {
  return `
    ${buildHeader()}
    ${buildSummary()}
    ${buildCycleCard()}
    ${buildTabs()}
    <div class="date-row">
      <label>Date</label>
      <input type="date" id="date-input" value="${todayISO()}">
    </div>
    <div id="panel">${buildPanel()}</div>
    <div class="btn-row">
      <button class="btn primary" id="save-btn">✓ Save session</button>
      <button class="btn" id="report-btn">📋 Weekly report</button>
    </div>
    <div id="report-output"></div>
    <p class="footer-note">Data lives on this device only.<br>AirDrop this file again after major updates.</p>
  `;
}

function buildHeader() {
  const today = new Date().toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"});
  return `<div class="header">
    <div>
      <h1>💪 Workout</h1>
      <div class="header-date">${today}</div>
    </div>
    <button class="btn" id="phase-toggle-btn" style="flex:0;padding:6px 12px;font-size:12px;">
      Phase ${phase} rehab
    </button>
  </div>`;
}

function buildSummary() {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
  const thisWeek = logs.filter(l => new Date(l.date) >= cutoff).length;
  const total = logs.length;
  const pbCount = Object.keys(pbs).length;
  return `<div class="summary-card">
    <div class="stat-box"><span class="num">${thisWeek}</span><span class="lbl">This week</span></div>
    <div class="stat-box"><span class="num">${total}</span><span class="lbl">All sessions</span></div>
    <div class="stat-box"><span class="num">${pbCount}</span><span class="lbl">PBs set 🏆</span></div>
  </div>`;
}

function buildCycleCard() {
  const last4 = logs.slice(-4).map(l => l.tab);
  while (last4.length < 4) last4.unshift(null);
  const nextUp = getNextUp();
  const slots = last4.map((t, i) => {
    if (!t) return `<div class="cycle-slot empty">—</div>`;
    const isLatest = i === 3;
    return `<div class="cycle-slot ${isLatest ? 'done' : 'done'}" title="${t}">
      ${t === "Upper A" ? "A" : t === "Upper B" ? "B" : "Legs"}${isLatest ? " ✓" : " ✓"}
    </div>`;
  }).join("");
  return `<div class="cycle-card">
    <div class="cycle-header">Last 4 sessions</div>
    <div class="cycle-slots">${slots}</div>
    <div class="next-up">Next up → <strong>${nextUp}</strong></div>
  </div>`;
}

function buildTabs() {
  const allTabs = ["Rehab", ...LIFTING_TABS];
  return `<div class="tabs-wrap">
    ${allTabs.map(t => `<div class="tab ${t === currentTab ? "active" : ""} ${t === "Rehab" ? "rehab-tab" : ""}" data-tab="${t}">${t === "Rehab" ? "🧘 Rehab" : t}</div>`).join("")}
  </div>`;
}

function buildPanel() {
  if (currentTab === "Rehab") return buildRehabPanel();
  return buildLiftingPanel(currentTab);
}

// ─── REHAB PANEL ─────────────────────────────────────────────────────────────

function buildRehabPanel() {
  const list = phase === 1 ? REHAB_PHASE1 : REHAB_PHASE2;
  const cards = list.map(ex => {
    const checked = rehabChecks[ex.id] || false;
    return `<div class="rehab-card">
      <div class="rehab-card-name">${ex.name}</div>
      <div class="rehab-prescription">${ex.prescription}</div>
      <div class="rehab-done-row">
        <div class="rehab-done-btn ${checked ? "checked" : ""}" data-rehab="${ex.id}">
          ${checked ? "✓ Done" : "Mark done"}
        </div>
      </div>
    </div>`;
  }).join("");
  return `<div class="phase-badge">Phase ${phase} · ${phase === 1 ? "Weeks 1-2" : "Week 3+"}</div>${cards}`;
}

// ─── LIFTING PANEL ───────────────────────────────────────────────────────────

function buildLiftingPanel(tab) {
  return EXERCISES[tab].map(ex => {
    if (ex.type === "superset") return buildSupersetCard(ex);
    return buildLiftCard(ex);
  }).join("");
}

function buildLiftCard(ex) {
  const last = lastLogFor(ex.id);
  const pb = pbs[ex.id];
  const allV = allVolumesFor(ex.id);
  const lastVol = last ? volume(last.weight, last.reps) : 0;
  const pbVol = pb ? pb.volume : 0;
  return `<div class="card" id="card-${ex.id}">
    <div class="card-top">
      <div class="ex-name">${ex.name}</div>
      <div class="ex-meta">
        ${last ? `<span class="ex-last">Last: ${last.weight}kg × ${last.reps} (${fmt(last.date)})</span>` : ""}
        ${pb ? `<span class="ex-pb">🏆 PB: ${pb.weight}kg × ${pb.reps}</span>` : ""}
        ${trendBadge(ex.id, false)}
      </div>
    </div>
    <div class="fields">
      <div class="field">
        <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg"
          data-ex="${ex.id}" data-field="weight" value="">
        <span class="unit">kg</span>
      </div>
      <div class="field">
        <input type="number" inputmode="numeric" min="0" step="1" placeholder="reps"
          data-ex="${ex.id}" data-field="reps" value="">
        <span class="unit">reps</span>
      </div>
    </div>
    ${sparkline(allV)}
  </div>`;
}

function buildSupersetCard(ex) {
  const partsHTML = ex.parts.map((part, idx) => {
    const last = lastLogForPart(part.id);
    const pb = pbs["part_" + part.id];
    const allV = allVolumesForPart(part.id);
    const isOptionalWeight = part.weightOptional;
    return `
      ${idx > 0 ? '<div class="superset-divider"></div>' : ""}
      <div class="sub-ex-name">${part.name}</div>
      ${last ? `<span class="ex-last" style="display:block;margin-bottom:4px;">Last: ${last.weight ? last.weight + "kg × " : ""}${last.reps} reps (${fmt(last.date)})</span>` : ""}
      ${pb && pb.volume > 0 ? `<span class="ex-pb" style="display:block;margin-bottom:4px;">🏆 PB: ${pb.weight ? pb.weight + "kg × " : ""}${pb.reps} reps</span>` : ""}
      ${trendBadge(part.id, true)}
      <div class="fields" style="margin-top:6px;">
        ${!isOptionalWeight ? `<div class="field">
          <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg"
            data-superex="${ex.id}" data-part="${part.id}" data-field="weight" value="">
          <span class="unit">kg</span>
        </div>` : `<div class="field">
          <input type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg (opt)"
            data-superex="${ex.id}" data-part="${part.id}" data-field="weight" value="">
          <span class="unit">kg</span>
        </div>`}
        <div class="field">
          <input type="number" inputmode="numeric" min="0" step="1" placeholder="reps"
            data-superex="${ex.id}" data-part="${part.id}" data-field="reps" value="">
          <span class="unit">reps</span>
        </div>
      </div>
      ${sparkline(allV)}
    `;
  }).join("");

  return `<div class="card" id="card-${ex.id}">
    <div class="superset-label">⚡ Superset</div>
    ${partsHTML}
  </div>`;
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────

function bindEvents() {
  // tabs
  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      currentTab = t.dataset.tab;
      render();
    });
  });

  // phase toggle
  const phaseBtn = document.getElementById("phase-toggle-btn");
  if (phaseBtn) phaseBtn.addEventListener("click", () => {
    const newPhase = phase === 1 ? 2 : 1;
    if (confirm(`Switch to Phase ${newPhase} rehab?`)) {
      phase = newPhase;
      save(KEY_PHASE, phase);
      rehabChecks = {};
      render();
    }
  });

  // rehab checks
  document.querySelectorAll(".rehab-done-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.rehab;
      rehabChecks[id] = !rehabChecks[id];
      btn.className = "rehab-done-btn" + (rehabChecks[id] ? " checked" : "");
      btn.textContent = rehabChecks[id] ? "✓ Done" : "Mark done";
    });
  });

  // save
  document.getElementById("save-btn").addEventListener("click", saveSession);

  // report
  document.getElementById("report-btn").addEventListener("click", buildReport);
}

// ─── SAVE ────────────────────────────────────────────────────────────────────

function saveSession() {
  const dateVal = document.getElementById("date-input").value || todayISO();
  const sets = {};
  let hasData = false;
  let newPB = false;

  if (currentTab === "Rehab") {
    // save rehab log
    const anyDone = Object.values(rehabChecks).some(v => v);
    if (!anyDone) { alert("Mark at least one rehab exercise as done first."); return; }
    rehabLogs.push({ date: dateVal, checks: { ...rehabChecks }, phase });
    save(KEY_REHAB, rehabLogs);
    flashSaved("Rehab saved ✓");
    rehabChecks = {};
    render();
    return;
  }

  // collect lifting inputs
  document.querySelectorAll("[data-ex]").forEach(inp => {
    const exId = inp.dataset.ex;
    const field = inp.dataset.field;
    if (!sets[exId]) sets[exId] = {};
    sets[exId][field] = parseFloat(inp.value) || 0;
  });

  // collect superset inputs
  document.querySelectorAll("[data-superex]").forEach(inp => {
    const exId = inp.dataset.superex;
    const partId = inp.dataset.part;
    const field = inp.dataset.field;
    if (!sets[exId]) sets[exId] = { parts: {} };
    if (!sets[exId].parts) sets[exId].parts = {};
    if (!sets[exId].parts[partId]) sets[exId].parts[partId] = {};
    sets[exId].parts[partId][field] = parseFloat(inp.value) || 0;
  });

  // check if any data entered
  Object.entries(sets).forEach(([exId, s]) => {
    if (s.parts) {
      Object.entries(s.parts).forEach(([partId, p]) => {
        if (p.reps > 0) {
          hasData = true;
          if (checkPBPart(partId, p.weight, p.reps)) newPB = true;
        }
      });
    } else {
      if (s.reps > 0) {
        hasData = true;
        if (checkPB(exId, s.weight, s.reps)) newPB = true;
      }
    }
  });

  if (!hasData) { alert("Enter at least one exercise before saving."); return; }

  logs.push({ date: dateVal, tab: currentTab, sets });
  save(KEY_LOGS, logs);

  flashSaved(newPB ? "🏆 New PB! Saved!" : "✓ Saved!");
  setTimeout(() => render(), 1600);
}

function flashSaved(msg) {
  const btn = document.getElementById("save-btn");
  if (!btn) return;
  btn.textContent = msg;
  btn.classList.add("saved");
  setTimeout(() => {
    btn.textContent = "✓ Save session";
    btn.classList.remove("saved");
  }, 1500);
}

// ─── REPORT ──────────────────────────────────────────────────────────────────

function buildReport() {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
  const recent = logs.filter(l => new Date(l.date) >= cutoff);
  const recentRehab = rehabLogs.filter(l => new Date(l.date) >= cutoff);
  const out = document.getElementById("report-output");

  if (recent.length === 0 && recentRehab.length === 0) {
    out.innerHTML = `<div class="report-box"><p class="report-empty">No sessions logged in the last 7 days yet.</p></div>`;
    return;
  }

  const lines = [];
  lines.push(`Weekly Training Report — last 7 days`);
  lines.push(`Lifting sessions: ${recent.length} | Rehab sessions: ${recentRehab.length}`);
  lines.push("");

  recent.forEach(l => {
    lines.push(`${fmt(l.date)} · ${l.tab}`);
    Object.entries(l.sets).forEach(([exId, s]) => {
      if (s.parts) {
        Object.entries(s.parts).forEach(([partId, p]) => {
          if (p.reps > 0) {
            const name = findPartName(partId);
            lines.push(`  ${name}: ${p.weight ? p.weight + "kg × " : ""}${p.reps} reps`);
          }
        });
      } else if (s.reps > 0) {
        const name = findExName(exId);
        lines.push(`  ${name}: ${s.weight}kg × ${s.reps} reps`);
      }
    });
    lines.push("");
  });

  if (recentRehab.length > 0) {
    lines.push("Rehab completed:");
    recentRehab.forEach(r => {
      const done = Object.entries(r.checks).filter(([,v]) => v).map(([id]) => findRehabName(id, r.phase));
      lines.push(`  ${fmt(r.date)}: ${done.join(", ")}`);
    });
    lines.push("");
  }

  lines.push("Please analyse:");
  lines.push("1. Flag any exercises where weight/reps dropped vs prior sessions");
  lines.push("2. Note good progression or new PBs");
  lines.push("3. Check rehab consistency");
  lines.push("4. Suggest 1-2 adjustments for next week");

  const text = lines.join("\n");
  out.innerHTML = `<div class="report-box">
    <pre>${text}</pre>
    <button class="btn primary" id="copy-btn" style="width:100%">📋 Copy to paste into Claude</button>
    <p class="copy-note" id="copy-note"></p>
  </div>`;

  document.getElementById("copy-btn").addEventListener("click", () => {
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById("copy-note").textContent = "Copied! Paste into your Claude chat.";
      setTimeout(() => { const n = document.getElementById("copy-note"); if(n) n.textContent = ""; }, 2500);
    }).catch(() => {
      document.getElementById("copy-note").textContent = "Select and copy manually above.";
    });
  });
}

// ─── LOOKUP HELPERS ──────────────────────────────────────────────────────────

function findExName(exId) {
  for (const tab of Object.values(EXERCISES)) {
    for (const ex of tab) {
      if (ex.id === exId) return ex.name;
    }
  }
  return exId;
}

function findPartName(partId) {
  for (const tab of Object.values(EXERCISES)) {
    for (const ex of tab) {
      if (ex.type === "superset") {
        for (const p of ex.parts) {
          if (p.id === partId) return p.name;
        }
      }
    }
  }
  return partId;
}

function findRehabName(id, ph) {
  const list = ph === 1 ? REHAB_PHASE1 : REHAB_PHASE2;
  const found = list.find(r => r.id === id);
  return found ? found.name : id;
}

// ─── INIT ────────────────────────────────────────────────────────────────────

render();
</script>
